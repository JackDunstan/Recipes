<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes — Home</title>
  <meta property="og:title" content="Recipes — Home">
  <meta property="og:description" content="Kitchen recipe library and cocktail recipes matched to your bar inventory.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/assets/css/shared.css">
  <style>
    .filter-bar {
      background: rgba(10,10,10,0.85);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    /* ── Mode toggle ── */
    .mode-toggle {
      display: flex;
      border: 1px solid var(--border);
    }
    .mode-btn {
      padding: 0.3rem 0.7rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--surface);
      color: var(--fg-muted);
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-mono);
    }
    .mode-btn + .mode-btn { border-left: 1px solid var(--border); }
    .mode-btn.active { background: var(--accent-dim); color: var(--accent); }

    /* ── Serves toggle ── */
    .serves-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }
    .serves-btn {
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .serves-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── Status bars ── */
    #inventory-status {
      padding: 0.5rem 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #inventory-status a { color: var(--accent); text-decoration: none; font-size: 0.6rem; }

    #status {
      padding: 0.45rem 1.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,0.85);
    }

    /* ── Search bar ── */
    .search-bar {
      padding: 0.6rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,0.85);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .search-bar .search-input { width: 100%; max-width: 400px; }
    .sort-select {
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      padding: 0.4rem 0.6rem;
      flex-shrink: 0;
    }

    /* ── Split layout ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 120px);
    }
    @media (max-width: 700px) {
      .right-panel { display: none; }
      .right-panel.visible { display: flex !important; }
    }

    /* ── Left panel ── */
    .left-panel { border-right: 1px solid var(--border); overflow-y: auto; }

    /* ── Recipe list items ── */
    .recipe-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;

    .recipe-item.active { background: var(--surface2); }
    .recipe-item.active::after {
      content: '';

      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--accent);
    }

      width: 48px; height: 48px;

      text-transform: uppercase;

    .cocktail-item.active::after {

      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.4rem;
      border: 1px solid var(--border);
      color: var(--fg-muted);
    }
    .badge.missing { border-color: #3a1a1a; color: #8b4444; }

    /* ── Right/detail panel ── */
    .right-panel {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      position: sticky;

    .detail-image {
      width: 100%;

      object-fit: cover;

      background: var(--border);

    .detail-name {
      font-family: var(--font-serif);

    }
    .detail-meta {
      display: flex;
      gap: 1.5rem;

      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;

<script>
// ─── Mode ─────────────────────────────────────────────────────────────────────
let currentMode = location.hash === '#cocktails' ? 'cocktails' : 'recipes';

function setMode(mode) {
  currentMode = mode;
  history.replaceState(null, '', location.pathname + (mode === 'cocktails' ? '#cocktails' : ''));

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });

  const c = mode === 'cocktails';
  document.getElementById('recipe-filter-bar').classList.toggle('hidden', c);
  document.getElementById('recipe-search-bar').classList.toggle('hidden', c);
  document.getElementById('status').classList.toggle('hidden', c);
  document.getElementById('cocktail-filter-bar').classList.toggle('hidden', !c);
  document.getElementById('inventory-status').classList.toggle('hidden', !c);
  document.getElementById('serves-toggle').classList.toggle('hidden', !c);
  document.getElementById('recipe-list').classList.toggle('hidden', c);
  document.getElementById('cocktail-list').classList.toggle('hidden', !c);
  document.getElementById('page-title').textContent = c ? 'Cocktails' : 'Recipes';

  selectedRecipeSlug = null;
  selectedCocktailId = null;
  document.getElementById('right-panel').innerHTML = `
    <div class="detail-empty">
      <div class="detail-empty-icon">◎</div>
      <div class="detail-empty-text">Select a ${c ? 'cocktail' : 'recipe'}</div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════════════
// RECIPES
// ═══════════════════════════════════════════════════════════════════════════════
const MD_FILES = [

  'basic-no-knead-bread',
  'bloody-mary-pork-scotch-eggs',
  'broccoli-and-stilton-soup',

  'creamy-lemon-garlic-chicken-with-asparagus-30-minutes',
  'creamy_vegetarian_boscaiola',
  'dry_fried_green_beans',
  'felicity-cloake-s-perfect-vegetarian-chilli',

  'homemade-authentic-pizza',
  'homemade-candied-peel',
  'how-to-cook-leek-and-potato-soup',
  'how-to-cook-the-perfect-colcannon',
  'how-to-cook-the-perfect-irish-barmbrack',
  'how-to-cook-the-perfect-laksa',
  'how-to-cook-the-perfect-souvlaki',

  'how-to-make-the-hummus-of-your-life-according-to-one-of-the-countrys-best-middle-eastern-chefs',
  'how-to-make-the-perfect-gougeres',
  'joshuas-multipurpose-dough',
  'laksa-noodle-soup',
  'leftover-roast-lamb-vindaloo',
  'pan-seared-duck-breast-with-orange-pan-sauce',
  'perfect-chicken-adobo',
  'perfect-massaman',

  'red-cooked-pork-steak-braise',

  'spinach-and-ricotta-pasta',
  'tangzhong',
  'tuna-mornay-bake',
  'vodka-marinated-steak',
];

const CATEGORY_KEYWORDS = {
  bread:  ['bread', 'dough', 'barmbrack', 'tangzhong', 'gougere', 'pizza'],
  soup:   ['soup', 'laksa', 'chilli', 'colcannon'],
  pasta:  ['pasta', 'spaghetti', 'carbonara', 'bolognese', 'linguine'],
  meat:   ['steak', 'beef', 'pork', 'ham', 'chicken', 'duck', 'meat pie', 'scotch egg', 'souvlaki', 'adobo'],
  fish:   ['fish', 'prawn', 'seafood'],
  curry:  ['curry', 'massaman', 'korma', 'laksa'],
  baking: ['cake', 'pudding', 'barmbrack', 'candied', 'ricotta', 'gougere'],
};

function recipeCategory(recipe) {
  const text = (recipe.recipe_name + ' ' + recipe.ingredients_summary.join(' ')).toLowerCase();
  const tagText = (
    (recipe.metadata?.categories || []).join(' ') + ' ' +
    (recipe.metadata?.tags || []).join(' ')
  ).toLowerCase();
  for (const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    if (keywords.some(k => text.includes(k) || tagText.includes(k))) return cat;
  }
  return 'other';
}

let RECIPES = [];
let recipeFilter = 'all';
let searchQuery = '';
let selectedRecipeSlug = null;
let currentSort = 'name';

function parseFrontmatter(text) {
  const match = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) return { meta: {}, body: text };
  const [, fmText, body] = match;
  const meta = {};
  fmText.split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx === -1) return;
    const key = line.slice(0, idx).trim();
    const raw = line.slice(idx + 1).trim();
    if (raw === '') { meta[key] = null; return; }
    try { meta[key] = JSON.parse(raw); }
    catch { meta[key] = raw; }
  });
  return { meta, body };
}

function parseSections(body) {
  const sections = {};
  let current = null;
  for (const line of body.split('\n')) {
    const h2 = line.match(/^##\s+(.*)/);
    if (h2) { current = h2[1].trim().toLowerCase(); sections[current] = []; continue; }
    if (line.match(/^#\s+/)) continue;
    if (current) sections[current].push(line);
  }
  Object.keys(sections).forEach(k => {
    const arr = sections[k];
    while (arr.length && arr[0].trim() === '') arr.shift();
    while (arr.length && arr[arr.length - 1].trim() === '') arr.pop();
  });
  return sections;
}

function parseRecipeMarkdown(text, slug) {
  const { meta, body } = parseFrontmatter(text);
  const sections = parseSections(body);

  const ingredients = (sections['ingredients'] || []).map(line => {
    const bold = line.match(/^\*\*(.*)\*\*$/);
    if (bold) return bold[1];
    const bullet = line.match(/^-\s+(.*)/);
    return bullet ? bullet[1] : line;
  }).filter(l => l.trim() !== '');

  const directions = (sections['directions'] || []).map(line => {
    const numbered = line.match(/^\d+\.\s+(.*)/);
    return numbered ? numbered[1] : line;
  }).filter(l => l.trim() !== '');

  const notes = (sections['notes'] || []).map(line => {
    const bullet = line.match(/^-\s+(.*)/);
    return bullet ? bullet[1] : line;
  }).filter(l => l.trim() !== '');

  return {
    recipe_name: meta.recipe_name || '',
    metadata: {
      rating: meta.rating ?? null,
      categories: meta.categories || [],
      tags: meta.tags || [],
      date_added: meta.date_added ?? null,
      source_url: meta.source_url ?? null,
      author: meta.author ?? null,
      image: meta.image ?? null,
      servings: meta.servings ?? null,
      prep_time: meta.prep_time ?? null,
      cook_time: meta.cook_time ?? null,
    },
    ingredients_summary: ingredients,
    directions,
    notes,
    storage: (sections['storage'] || []).join(' ').trim(),
    slug,
  };
}

function getFilteredRecipes() {
  let list = RECIPES;
  if (recipeFilter !== 'all') list = list.filter(r => recipeCategory(r) === recipeFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(r =>
      r.recipe_name.toLowerCase().includes(q) ||
      r.ingredients_summary.some(i => i.toLowerCase().includes(q))
    );
  }
  list = list.slice();
  if (currentSort === 'date-desc') {
    list.sort((a, b) =>
      (b.metadata?.date_added || '').localeCompare(a.metadata?.date_added || '') ||
      a.recipe_name.localeCompare(b.recipe_name)
    );
  } else if (currentSort === 'date-asc') {
    list.sort((a, b) =>
      (a.metadata?.date_added || '').localeCompare(b.metadata?.date_added || '') ||
      a.recipe_name.localeCompare(b.recipe_name)
    );
  } else {
    list.sort((a, b) => a.recipe_name.localeCompare(b.recipe_name));
  }
  return list;
}

function renderRecipeList() {
  const filtered = getFilteredRecipes();
  const list = document.getElementById('recipe-list');
  list.innerHTML = '';
  document.getElementById('status').textContent = `${filtered.length} of ${RECIPES.length} recipes`;

  if (filtered.length === 0) {
    list.innerHTML = `<div style="padding:2rem;color:var(--fg-muted);font-size:0.75rem;text-align:center">No recipes match</div>`;
    return;
  }

  filtered.forEach(recipe => {
    const item = document.createElement('div');
    item.className = `recipe-item${selectedRecipeSlug === recipe.slug ? ' active' : ''}`;
    item.dataset.slug = recipe.slug;

    const ingredientCount = recipe.ingredients_summary.filter(i =>
      !i.toUpperCase().includes('FOR THE') && !i.toUpperCase().startsWith('FOR ')
    ).length;
    const thumbPath = recipe.metadata?.image ? `/recipes/${recipe.metadata.image}` : null;

    item.innerHTML = `
      <div class="recipe-info">
        <div class="recipe-name">${recipe.recipe_name}</div>
      </div>
      ${thumbPath
        ? `<img class="recipe-thumb" src="${thumbPath}" alt="" loading="lazy">`
        : `<div class="recipe-count">${ingredientCount} ingr.</div>`
      }
    `;
    item.addEventListener('click', () => selectRecipe(recipe.slug));
    list.appendChild(item);
  });
}

function selectRecipe(slug) {
  selectedRecipeSlug = slug;
  const recipe = RECIPES.find(r => r.slug === slug);
  if (!recipe) return;
  document.querySelectorAll('.recipe-item').forEach(el => {
    el.classList.toggle('active', el.dataset.slug === slug);
  });
  renderRecipeDetail(recipe);
  document.getElementById('right-panel').classList.add('visible');
}

function renderRecipeDetail(recipe) {
  const imagePath = recipe.metadata?.image ? `/recipes/${recipe.metadata.image}` : null;
  const sourceUrl = recipe.metadata?.source_url || null;
  const author = recipe.metadata?.author || null;
  const metaParts = [];
  if (recipe.metadata?.servings) metaParts.push(recipe.metadata.servings);
  if (recipe.metadata?.prep_time) metaParts.push(`Prep ${recipe.metadata.prep_time}`);
  if (recipe.metadata?.cook_time) metaParts.push(`Cook ${recipe.metadata.cook_time}`);
  if (author && sourceUrl) metaParts.push(`<a href="${sourceUrl}" target="_blank">${author} ↗</a>`);
  else if (author) metaParts.push(author);

  const ingredientHTML = recipe.ingredients_summary.map(ing => {
    if (/^(FOR |for the |FOR THE )/i.test(ing.trim())) {
      return `<li class="ingredient-item section-header">${ing.replace(/:$/, '')}</li>`;
    }
    return `<li class="ingredient-item">${ing}</li>`;
  }).join('');

  const directionHTML = recipe.directions.map((step, i) => `
    <li class="direction-item">
      <span class="direction-num">${String(i + 1).padStart(2, '0')}.</span>
      <span>${step}</span>
    </li>
  `).join('');

  document.getElementById('right-panel').innerHTML = `
    ${imagePath ? `<img class="detail-image" src="${imagePath}" alt="${recipe.recipe_name}" loading="lazy">` : ''}
    <div>
      <div class="detail-name">${recipe.recipe_name}</div>
      ${metaParts.length > 0 ? `<div class="detail-meta">${metaParts.join(' · ')}</div>` : ''}
    </div>
    <div>
      <div class="section-label">Ingredients</div>
      <ul class="ingredient-list">${ingredientHTML}</ul>
    </div>
    ${recipe.directions.length > 0 ? `
    <div>
      <div class="section-label">Method</div>
      <ol class="directions-list">${directionHTML}</ol>
    </div>
    ` : ''}
    ${recipe.notes?.length > 0 ? `
    <div>
      <div class="section-label">Notes</div>
      <p class="notes-text">${recipe.notes.join(' ')}</p>
    </div>
    ` : ''}
    ${recipe.storage ? `
    <div>
      <div class="section-label">Storage</div>
      <p class="notes-text">${recipe.storage}</p>
    </div>
    ` : ''}
  `;
}

function setRecipeFilter(filter) {
  recipeFilter = filter;
  document.querySelectorAll('#recipe-filter-bar .filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  renderRecipeList();
}

function onSearch() {
  searchQuery = document.getElementById('search-input').value.trim();
  renderRecipeList();
}

function onSortChange() {
  currentSort = document.getElementById('sort-select').value;
  renderRecipeList();
}

// ═══════════════════════════════════════════════════════════════════════════════
// COCKTAILS
// ═══════════════════════════════════════════════════════════════════════════════
const COCKTAIL_FILES = [
  'margarita-straight-up',
  'margarita-rocks',
  'negroni',
  'kingston-negroni',
  'boulevardier',
  'paper-plane',
  'last-word',
  'vesper',
  'old-fashioned',
  'sidecar',
  'white-lady',
  'manhattan',
  'black-manhattan',
  'mai-tai',
  'jungle-bird',
  'mezcal-negroni',
  'french-75',
  'sazerac',
  'corpse-reviver-2',
  'mojito',
];

function parseCocktailMarkdown(text, slug) {
  const { meta, body } = parseFrontmatter(text);
  const sections = parseSections(body);

  const ingredients = (sections['ingredients'] || [])
    .map(line => {
      const bullet = line.match(/^-\s+(.*)/);
      return bullet ? bullet[1] : line;
    })
    .filter(l => l.trim() !== '')
    .map(line => {
      let m = line.match(/^(\d+(?:\.\d+)?)(ml)\s+(.+)$/);
      if (m) return { amount: parseFloat(m[1]), unit: m[2], name: m[3] };
      m = line.match(/^(\d+(?:\.\d+)?)\s+(dashes?|leaves?)\s+(.+)$/);
      if (m) return { amount: parseFloat(m[1]), unit: m[2], name: m[3] };
      return null;
    })
    .filter(Boolean);

  const methodLines = (sections['method'] || []).filter(l => l.trim() !== '');
  const notesLines = (sections['notes'] || []).filter(l => l.trim() !== '');

  return {
    id: slug,
    name: meta.cocktail_name || '',
    style: meta.style || '',
    glass: meta.glass || '',
    garnish: meta.garnish || '',
    ingredients,
    method: methodLines.join(' '),
    notes: notesLines.join(' '),
  };
}

let COCKTAILS = [];
let INGREDIENTS = new Set();
let currentServes = 1;
let cocktailFilter = 'available';
let selectedCocktailId = null;

function parseIngredients(md) {
  INGREDIENTS.clear();
  for (const line of md.split('\n')) {
    const trimmed = line.replace(/^[-*]\s+/, '').trim().toLowerCase();
    if (trimmed && !trimmed.startsWith('#') && trimmed.length > 1) {
      INGREDIENTS.add(trimmed);
    }
  }
}

function hasIngredient(name) {
  const n = name.toLowerCase();
  if (INGREDIENTS.has(n)) return true;
  for (const ing of INGREDIENTS) {
    if (n.includes(ing) || ing.includes(n)) return true;
  }
  return false;
}

function canMake(cocktail) {
  return cocktail.ingredients.every(i => hasIngredient(i.name));
}

function getMissing(cocktail) {
  return cocktail.ingredients.filter(i => !hasIngredient(i.name));
}

function formatAmount(amount, unit, serves) {
  const scaled = amount * serves;
  if (unit === 'ml') return `${scaled % 1 === 0 ? scaled : scaled.toFixed(1)}ml`;
  if (unit === 'dash' || unit === 'dashes') return `${scaled} ${scaled === 1 ? 'dash' : 'dashes'}`;
  if (unit === 'leaves') return `${scaled} leaves`;
  return `${scaled}${unit}`;
}

function renderCocktailList() {
  const list = document.getElementById('cocktail-list');
  list.innerHTML = '';

  let filtered = COCKTAILS;
  if (cocktailFilter === 'available') filtered = COCKTAILS.filter(c => canMake(c));
  else if (cocktailFilter === 'stirred') filtered = COCKTAILS.filter(c => c.style === 'stirred');
  else if (cocktailFilter === 'shaken') filtered = COCKTAILS.filter(c => c.style === 'straight-up' || c.style === 'on-the-rocks');
  else if (cocktailFilter === 'built') filtered = COCKTAILS.filter(c => c.style === 'built');

  if (filtered.length === 0) {
    list.innerHTML = `<div style="padding:2rem;color:var(--fg-muted);font-size:0.75rem;text-align:center">No cocktails match current filter</div>`;
    return;
  }

  filtered.forEach(cocktail => {
    const available = canMake(cocktail);
    const missing = getMissing(cocktail);
    const item = document.createElement('div');
    item.className = `cocktail-item${available ? '' : ' unavailable'}${selectedCocktailId === cocktail.id ? ' active' : ''}`;
    item.dataset.id = cocktail.id;
    item.innerHTML = `
      <div>
        <div class="cocktail-name">${cocktail.name}</div>
        <div class="cocktail-meta">${cocktail.glass} · ${cocktail.style.replace(/-/g, ' ')}</div>
      </div>
      <div class="cocktail-badges">
        ${!available ? `<span class="badge missing">${missing.length} missing</span>` : ''}
      </div>
    `;
    if (available) item.addEventListener('click', () => selectCocktail(cocktail.id));
    list.appendChild(item);
  });
}

function selectCocktail(id) {
  selectedCocktailId = id;
  const cocktail = COCKTAILS.find(c => c.id === id);
  if (!cocktail) return;
  document.querySelectorAll('.cocktail-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  renderCocktailDetail(cocktail);
  document.getElementById('right-panel').classList.add('visible');
}

function renderCocktailDetail(cocktail) {
  const missing = getMissing(cocktail);
  document.getElementById('right-panel').innerHTML = `
    <div>
      <div class="detail-name">${cocktail.name}</div>
      <div class="detail-meta">
        <span>${cocktail.glass}</span>
        <span>${cocktail.style.replace(/-/g, ' ')}</span>
        ${cocktail.garnish ? `<span>Garnish: ${cocktail.garnish}</span>` : ''}
      </div>
    </div>
    <div>
      <div class="section-label">Ingredients</div>
      <ul class="ingredient-list">
        ${cocktail.ingredients.map(i => `
          <li class="ingredient-item${hasIngredient(i.name) ? '' : ' missing'}">
            <span class="ing-amount">${formatAmount(i.amount, i.unit, currentServes)}</span>
            ${i.name}
          </li>
        `).join('')}
      </ul>
    </div>
    <div>
      <div class="section-label">Method</div>
      <p class="method-text">${cocktail.method}</p>
    </div>
    ${cocktail.notes ? `
    <div>
      <div class="section-label">Notes</div>
      <p class="notes-text">${cocktail.notes}</p>
    </div>
    ` : ''}
    ${missing.length > 0 ? `
    <div>
      <div class="section-label">Missing</div>
      <div>${missing.map(i => `<span class="missing-tag">${i.name}</span>`).join('')}</div>
    </div>
    ` : ''}
  `;
}

function setCocktailFilter(filter) {
  cocktailFilter = filter;
  document.querySelectorAll('#cocktail-filter-bar .filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  renderCocktailList();
}

function setServes(n) {
  currentServes = n;
  document.querySelectorAll('.serves-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.serves) === n);
  });
  if (selectedCocktailId) {
    const cocktail = COCKTAILS.find(c => c.id === selectedCocktailId);
    if (cocktail) renderCocktailDetail(cocktail);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════════
async function init() {
  try {
    const [ingredientsRes, ...allTexts] = await Promise.all([
      fetch('/cocktails/ingredients.md'),
      ...COCKTAIL_FILES.map(slug =>
        fetch(`/cocktails/${slug}.md`)
          .then(r => r.ok ? r.text() : null)
          .catch(() => null)
      ),
      ...MD_FILES.map(slug =>
        fetch(`/recipes/${slug}.md`)
          .then(r => r.ok ? r.text() : null)
          .catch(() => null)
      )
    ]);

    parseIngredients(await ingredientsRes.text());

    const cocktailTexts = allTexts.slice(0, COCKTAIL_FILES.length);
    const recipeTexts = allTexts.slice(COCKTAIL_FILES.length);

    COCKTAILS = cocktailTexts
      .map((text, i) => text ? parseCocktailMarkdown(text, COCKTAIL_FILES[i]) : null)
      .filter(Boolean);

    RECIPES = recipeTexts
      .map((text, i) => text ? parseRecipeMarkdown(text, MD_FILES[i]) : null)
      .filter(Boolean)
      .sort((a, b) => a.recipe_name.localeCompare(b.recipe_name));

    const available = COCKTAILS.filter(c => canMake(c)).length;
    document.getElementById('inventory-text').textContent =
      `${INGREDIENTS.size} ingredients on hand · ${available} of ${COCKTAILS.length} cocktails available`;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').classList.remove('hidden');

    renderRecipeList();
    renderCocktailList();

    if (currentMode === 'cocktails') setMode('cocktails');
  } catch(e) {
    document.getElementById('loading').textContent = 'Error loading data — check console';
    console.error(e);
  }
}

init();
</script>
