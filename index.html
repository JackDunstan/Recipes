<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes — Jack Dunstan</title>
  <meta property="og:title" content="Recipes">
  <meta property="og:description" content="Jack's kitchen recipe library.">
  <meta property="og:type" content="website">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }

    .navbar-brand { font-weight: 600; letter-spacing: -0.02em; }

    .filter-bar { gap: 0.4rem; }

    #search { max-width: 340px; }

    .recipe-card {
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      height: 100%;
    }
    .recipe-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12) !important;
    }
    .recipe-card .card-img-top {
      height: 180px;
      object-fit: cover;
      background: #dee2e6;
    }
    .recipe-card .card-img-placeholder {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9ecef;
      color: #adb5bd;
      font-size: 2.5rem;
    }
    .card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
    .card-meta { font-size: 0.75rem; color: #6c757d; }

    .modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
    }
    .modal-title { font-size: 1.4rem; font-weight: 700; }
    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6c757d;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .ingredient-list { list-style: none; padding: 0; margin: 0; }
    .ingredient-list li {
      padding: 0.3rem 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.88rem;
    }
    .ingredient-list li:last-child { border-bottom: none; }
    .ingredient-list li.section-header {
      font-size: 0.75rem;
      font-weight: 600;
      color: #0d6efd;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: none;
      padding-top: 0.7rem;
    }
    .direction-step { font-size: 0.88rem; line-height: 1.7; }
    .direction-num { color: #0d6efd; font-weight: 700; min-width: 1.8rem; flex-shrink: 0; }
    .notes-text { font-size: 0.85rem; color: #6c757d; line-height: 1.7; }

    #no-results { display: none; }
    .count-badge { font-size: 0.75rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white border-bottom sticky-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-1 mb-1" viewBox="0 0 16 16">
        <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5v-4h3v4H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146z"/>
      </svg>
      Jack Dunstan
    </a>
    <span class="navbar-text fw-semibold">Recipes</span>
    <a class="btn btn-sm btn-outline-secondary ms-3" href="/cocktails/">Cocktails →</a>
    <input id="search" class="form-control form-control-sm ms-auto" type="search" placeholder="Search recipes or ingredients…" aria-label="Search">
  </div>
</nav>

<!-- Filter bar -->
<div class="bg-white border-bottom px-3 py-2 d-flex flex-wrap filter-bar align-items-center">
  <button class="btn btn-sm btn-primary" data-filter="all">All</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="bread">Bread</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="soup">Soup</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="pasta">Pasta</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="meat">Meat</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="fish">Fish</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="curry">Curry</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="baking">Baking</button>
  <span id="recipe-count" class="ms-auto text-muted count-badge"></span>
</div>

<!-- Recipe grid -->
<div class="container-fluid py-4 px-4">
  <div id="loading" class="text-center py-5 text-muted">Loading recipes…</div>
  <div id="no-results" class="text-center py-5 text-muted">No recipes match.</div>
  <div class="row g-3" id="grid"></div>
</div>

<!-- Recipe modal -->
<div class="modal fade" id="recipeModal" tabindex="-1" aria-labelledby="recipeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="modal-body" class="modal-body pt-0"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const MD_FILES = [
  'aussie-meat-pie',
  'basic-no-knead-bread',
  'bloody-mary-pork-scotch-eggs',
  'broccoli-and-stilton-soup',
  'broccoli-slaw',
  'chinese-steamed-fish-with-ginger-and-spring-onions',
  'chongqing_spicy_beef_noodle_soup',
  'confit-rare-breed-pork-belly-with-lentils-vinaigrette',
  'creamy-lemon-garlic-chicken-with-asparagus-30-minutes',
  'creamy_vegetarian_boscaiola',
  'dry_fried_green_beans',
  'felicity-cloake-s-perfect-vegetarian-chilli',
  'felicity-cloakes-recipe-for-real-rice-pudding',
  'five-ingredient-simple-green-pasta-salad',
  'ginger-glazed-ham',
  'heston-blumenthal-s-slow-roasted-rib-of-beef-with-bone-marrow-sauce',
  'homemade-authentic-pizza',
  'homemade-candied-peel',
  'how-to-cook-leek-and-potato-soup',
  'how-to-cook-the-perfect-colcannon',
  'how-to-cook-the-perfect-irish-barmbrack',
  'how-to-cook-the-perfect-laksa',
  'how-to-cook-the-perfect-souvlaki',
  'how-to-cook-the-perfect-sticky-orange-cake',
  'how-to-make-a-cheats-ricotta-cheese',
  'how-to-make-chicken-korma',
  'how-to-make-perfect-bolognese',
  'how-to-make-spaghetti-carbonara',
  'how-to-make-the-hummus-of-your-life-according-to-one-of-the-countrys-best-middle-eastern-chefs',
  'how-to-make-the-perfect-gougeres',
  'joshuas-multipurpose-dough',
  'laksa-noodle-soup',
  'leftover-roast-lamb-vindaloo',
  'pan-seared-duck-breast-with-orange-pan-sauce',
  'perfect-chicken-adobo',
  'perfect-massaman',
  'pork-scotch-carnitas',
  'recipetin-eats-x-good-food-how-to-make-the-ultimate-meat-pie',
  'red-cooked-pork-steak-braise',
  'slow_roasted_roma_tomato_pasta',
  'spinach-and-ricotta-pasta',
  'tangzhong',
  'tuna-mornay-bake',
  'vodka-marinated-steak',
];

const CATEGORY_KEYWORDS = {
  bread:  ['bread', 'dough', 'barmbrack', 'tangzhong', 'gougere', 'pizza'],
  soup:   ['soup', 'laksa', 'chilli', 'colcannon', 'noodle'],
  pasta:  ['pasta', 'spaghetti', 'carbonara', 'bolognese', 'boscaiola'],
  meat:   ['steak', 'beef', 'pork', 'ham', 'chicken', 'duck', 'meat pie', 'scotch egg', 'souvlaki', 'adobo', 'carnitas', 'lamb', 'braise'],
  fish:   ['fish', 'prawn', 'seafood', 'tuna'],
  curry:  ['curry', 'massaman', 'korma', 'laksa', 'vindaloo'],
  baking: ['cake', 'pudding', 'barmbrack', 'candied', 'ricotta', 'gougere'],
};

function parseFrontmatter(text) {
  const match = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) return { meta: {}, body: text };
  const [, fmText, body] = match;
  const meta = {};
  fmText.split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx === -1) return;
    const key = line.slice(0, idx).trim();
    const raw = line.slice(idx + 1).trim();
    if (!raw) { meta[key] = null; return; }
    try { meta[key] = JSON.parse(raw); } catch { meta[key] = raw; }
  });
  return { meta, body };
}

function parseSections(body) {
  const sections = {};
  let current = null;
  for (const line of body.split('\n')) {
    const h2 = line.match(/^##\s+(.*)/);
    if (h2) { current = h2[1].trim().toLowerCase(); sections[current] = []; continue; }
    if (line.match(/^#\s+/)) continue;
    if (current) sections[current].push(line);
  }
  for (const arr of Object.values(sections)) {
    while (arr.length && arr[0].trim() === '') arr.shift();
    while (arr.length && arr[arr.length - 1].trim() === '') arr.pop();
  }
  return sections;
}

function parseRecipe(text, slug) {
  const { meta, body } = parseFrontmatter(text);
  const sections = parseSections(body);

  const ingredients = (sections['ingredients'] || []).map(line => {
    const bold = line.match(/^\*\*(.*)\*\*$/);
    if (bold) return { type: 'header', text: bold[1] };
    const bullet = line.match(/^-\s+(.*)/);
    const content = bullet ? bullet[1] : line;
    return content.trim() ? { type: 'item', text: content } : null;
  }).filter(Boolean);

  const directions = (sections['directions'] || []).map(line => {
    const m = line.match(/^\d+\.\s+(.*)/);
    return m ? m[1] : line;
  }).filter(l => l.trim());

  const notes = (sections['notes'] || []).map(line => {
    const m = line.match(/^-\s+(.*)/);
    return m ? m[1] : line;
  }).filter(l => l.trim()).join(' ');

  const imagePath = meta.image || `images/${slug}.jpg`;

  return {
    slug,
    name: meta.recipe_name || '',
    image: imagePath,
    servings: meta.servings || null,
    prepTime: meta.prep_time || null,
    cookTime: meta.cook_time || null,
    author: meta.author || null,
    sourceUrl: meta.source_url || null,
    ingredients,
    directions,
    notes,
  };
}

function recipeCategory(recipe) {
  const text = (recipe.name + ' ' + recipe.ingredients.map(i => i.text).join(' ')).toLowerCase();
  for (const [cat, kws] of Object.entries(CATEGORY_KEYWORDS)) {
    if (kws.some(k => text.includes(k))) return cat;
  }
  return 'other';
}

let ALL_RECIPES = [];
let activeFilter = 'all';
let searchQuery = '';

function getFiltered() {
  return ALL_RECIPES.filter(r => {
    if (activeFilter !== 'all' && recipeCategory(r) !== activeFilter) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const haystack = r.name.toLowerCase() + ' ' + r.ingredients.map(i => i.text).join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const noResults = document.getElementById('no-results');
  const countEl = document.getElementById('recipe-count');
  const filtered = getFiltered();

  countEl.textContent = `${filtered.length} recipe${filtered.length !== 1 ? 's' : ''}`;
  grid.innerHTML = '';

  if (filtered.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  filtered.forEach(recipe => {
    const col = document.createElement('div');
    col.className = 'col-6 col-md-4 col-lg-3 col-xl-2';

    const meta = [recipe.servings, recipe.prepTime ? `Prep ${recipe.prepTime}` : null, recipe.cookTime ? `Cook ${recipe.cookTime}` : null]
      .filter(Boolean).join(' · ');

    col.innerHTML = `
      <div class="card recipe-card shadow-sm border-0" data-slug="${recipe.slug}">
        <img
          class="card-img-top"
          src="${recipe.image}"
          alt="${recipe.name}"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-img-placeholder" style="display:none">🍽️</div>
        <div class="card-body p-2">
          <div class="card-title mb-1">${recipe.name}</div>
          ${meta ? `<div class="card-meta">${meta}</div>` : ''}
        </div>
      </div>
    `;
    col.querySelector('.recipe-card').addEventListener('click', () => openModal(recipe.slug));
    grid.appendChild(col);
  });
}

function openModal(slug) {
  const recipe = ALL_RECIPES.find(r => r.slug === slug);
  if (!recipe) return;

  const metaParts = [
    recipe.servings,
    recipe.prepTime ? `Prep ${recipe.prepTime}` : null,
    recipe.cookTime ? `Cook ${recipe.cookTime}` : null,
  ].filter(Boolean);

  const sourceLink = recipe.author && recipe.sourceUrl
    ? `<a href="${recipe.sourceUrl}" target="_blank" rel="noopener" class="text-decoration-none">${recipe.author} ↗</a>`
    : recipe.author || '';

  const ingredientsHTML = recipe.ingredients.map(i => {
    if (i.type === 'header') {
      return `<li class="ingredient-list section-header">${i.text.replace(/:$/, '')}</li>`;
    }
    return `<li>${i.text}</li>`;
  }).join('');

  const directionsHTML = recipe.directions.map((step, idx) => `
    <div class="d-flex gap-2 direction-step mb-2">
      <span class="direction-num">${String(idx + 1).padStart(2, '0')}.</span>
      <span>${step}</span>
    </div>
  `).join('');

  document.getElementById('modal-body').innerHTML = `
    <img class="modal-img mb-3 rounded"
      src="${recipe.image}"
      alt="${recipe.name}"
      onerror="this.style.display='none'">
    <h2 class="modal-title mb-1">${recipe.name}</h2>
    ${metaParts.length ? `<p class="text-muted mb-0" style="font-size:0.82rem">${metaParts.join(' · ')}${sourceLink ? ' · ' + sourceLink : ''}</p>` : sourceLink ? `<p class="text-muted mb-0" style="font-size:0.82rem">${sourceLink}</p>` : ''}
    <hr>
    <div class="row g-4">
      <div class="col-md-5">
        <div class="section-label">Ingredients</div>
        <ul class="ingredient-list">${ingredientsHTML}</ul>
      </div>
      <div class="col-md-7">
        ${recipe.directions.length ? `
          <div class="section-label">Method</div>
          ${directionsHTML}
        ` : ''}
        ${recipe.notes ? `
          <div class="section-label mt-3">Notes</div>
          <p class="notes-text">${recipe.notes}</p>
        ` : ''}
      </div>
    </div>
  `;

  bootstrap.Modal.getOrCreateInstance(document.getElementById('recipeModal')).show();
}

// Filter buttons
document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => {
      b.classList.toggle('btn-primary', b.dataset.filter === activeFilter);
      b.classList.toggle('btn-outline-secondary', b.dataset.filter !== activeFilter);
    });
    renderGrid();
  });
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderGrid();
});

// Init
async function init() {
  try {
    const texts = await Promise.all(
      MD_FILES.map(slug =>
        fetch(`./${slug}.md`)
          .then(r => r.ok ? r.text() : null)
          .catch(() => null)
      )
    );

    ALL_RECIPES = texts
      .map((text, i) => text ? parseRecipe(text, MD_FILES[i]) : null)
      .filter(Boolean)
      .sort((a, b) => a.name.localeCompare(b.name));

    document.getElementById('loading').style.display = 'none';
    renderGrid();
  } catch (e) {
    document.getElementById('loading').textContent = 'Error loading recipes — check console.';
    console.error(e);
  }
}

init();
</script>
</body>
</html>
